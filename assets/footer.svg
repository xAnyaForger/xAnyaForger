<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="160" viewBox="0 0 1440 160" role="img" aria-labelledby="title description">
<title id="title">Keep learning. Keep building. — MiracleX</title><desc id="description">A thin cyan line and the MiracleX signature.</desc>
<defs>
  <linearGradient id="background" x2="1" y2="1"><stop stop-color="#080f1e"/><stop offset="1" stop-color="#060a13"/></linearGradient>
  <linearGradient id="cyan" x2="1" y2="1"><stop stop-color="#b6fff5"/><stop offset=".5" stop-color="#4fe8df"/><stop offset="1" stop-color="#4799ff"/></linearGradient>
  <linearGradient id="violet" x2=".2" y2="1"><stop stop-color="#a7a0ff"/><stop offset="1" stop-color="#5555d9"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#186d79" stop-opacity=".23"/><stop offset="1" stop-color="#186d79" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#6bb6d5" stroke-opacity=".065"/></pattern>
