<text x="48" y="108" fill="#91a8bc" font-family="Consolas, monospace" font-size="22" font-weight="400" letter-spacing="2">KEEP LEARNING. KEEP BUILDING.</text>
<text x="1090" y="108" fill="#67e8dc" font-family="Consolas, monospace" font-size="22" font-weight="400" >MIRACLEX</text>
